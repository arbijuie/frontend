allowBuilds:
  "@parcel/watcher": true
  esbuild: true

# GHSA-2883-xcg3-v3hh: @redocly/openapi-core (via openapi-typescript) pins js-yaml 4.3.1 exactly.
# Patch release only; remove once openapi-typescript ships a fixed redocly core.
overrides:
  js-yaml@4.3.1: 4.3.2
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr: brace-expansion
  # DoS via uncontrolled recursion and quadratic-time `{a},b}` expansion.
  # Two vulnerable branches in the tree, on different brace-expansion major lines:
  #   - brace-expansion@2.x requested by minimatch@5.x, via openapi-typescript >
  #     @redocly/openapi-core
  #   - brace-expansion@5.x requested by minimatch@10.x, via eslint and
  #     typescript-eslint
  # Patch releases only; remove once openapi-typescript / eslint bump their own
  # minimatch range past this.
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12